name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    name: check (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      # Windows leg: check out the way a default Git for Windows install does, so a
      # line-ending rewrite of a sealed file fails here instead of on a reader's machine.
      - name: Use the Git for Windows line-ending default
        if: runner.os == 'Windows'
        run: git config --global core.autocrlf true
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt
      - name: Install pinned requirements
        run: python -m pip install -r requirements.txt
      - name: Spec-derived checker tests
        run: python -m pytest -q tests
      - name: Sealed files are checked out byte for byte
        if: ${{ !cancelled() }}
        shell: bash
        run: |
          git ls-files -s -- ":(attr:-text)" | while read -r mode sha stage path; do
            if [ "$(git hash-object --no-filters -- "$path")" != "$sha" ]; then
              echo "checkout rewrote a sealed file: $path"
              exit 1
            fi
          done
          echo "every sealed file matches its committed blob"
      # The seal itself: every run folder's SHA256SUMS must match its files. The
      # .gitattributes pin keeps sealed bytes unchanged on the Windows leg.
      - name: Run folders match their SHA256SUMS
        if: ${{ !cancelled() }}
        shell: bash
        run: |
          found=0
          for sums in results/run-*/SHA256SUMS; do
            found=1
            echo "checking $sums"
            (cd "$(dirname "$sums")" && sha256sum --strict -c --quiet SHA256SUMS) || exit 1
          done
          [ "$found" = 1 ] || { echo "no results/run-*/SHA256SUMS found"; exit 1; }
          echo "every run folder matches its SHA256SUMS"
  art-receipts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Verify art receipt digests
        run: python3 scripts/check_art_receipts.py
