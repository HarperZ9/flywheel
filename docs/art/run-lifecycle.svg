<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 564" width="960" height="564" font-family="Hanken Grotesk, Segoe UI, ui-sans-serif, system-ui, sans-serif" role="img" aria-label="Eight stages from task to offline recheck, with a refusal path back to the tool request, ending in match, changed or unverifiable."><style>
  :root{ --void:#f4f3ef; --bone:#0b0c0e; --muted:#43474e;
    --hairline:rgba(11,12,14,.16); --card:rgba(255,255,255,.66);
    --verified:#1f7a52; --drift:#3a2bd6; }
  @media (prefers-color-scheme: dark){
    :root{ --void:#0b0e0f; --bone:#eef1ee; --muted:#9aa39c;
      --hairline:rgba(238,241,238,.18); --card:rgba(255,255,255,.05);
      --verified:#5fae93; --drift:#a99cf5; } }
  .bg{ fill:var(--void); }
  .card{ fill:var(--card); stroke:var(--hairline); stroke-width:1.4; }
  .n{ fill:var(--bone); font-size:15px; font-weight:650; }
  .s{ fill:var(--muted); font-size:11.5px; }
  .k{ fill:var(--muted); font-size:11px; letter-spacing:.16em; }
  .h{ fill:var(--bone); font-size:21px; font-weight:700; }
  .fwd{ stroke:var(--verified); stroke-width:2; fill:none; }
  .back{ stroke:var(--drift); stroke-width:1.8; fill:none; stroke-dasharray:5 4; }
  .thin{ stroke:var(--hairline); stroke-width:1.4; fill:none; }
  .step{ fill:var(--muted); font-size:11px; font-weight:700; letter-spacing:.1em; }
</style><marker id="af" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto"><path d="M0,0 L7,3 L0,6 Z" fill="var(--verified)"/></marker><marker id="ab" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto"><path d="M0,0 L7,3 L0,6 Z" fill="var(--drift)"/></marker><rect class="bg" width="960" height="564"/><text class="k" x="44" y="40" font-family="Conso, ui-monospace, Cascadia Mono, Consolas, monospace">ONE RUN, END TO END</text><text class="h" x="44" y="72">What happens to a task after you send it</text><path class="fwd" marker-end="url(#af)" d="M246.5 158H261.5"/><path class="fwd" marker-end="url(#af)" d="M471 158H486"/><path class="fwd" marker-end="url(#af)" d="M695.5 158H710.5"/><path class="fwd" marker-end="url(#af)" d="M920 158H940V276H20V350H37"/><path class="fwd" marker-end="url(#af)" d="M246.5 350H261.5"/><path class="fwd" marker-end="url(#af)" d="M471 350H486"/><path class="fwd" marker-end="url(#af)" d="M695.5 350H710.5"/><path class="back" marker-end="url(#ab)" d="M816.75 206V228H592.25V213"/><text class="k" x="704.5" y="245" text-anchor="middle" fill="var(--drift)">REFUSED, WITH THE REASON RETURNED TO THE MODEL</text><g><rect class="card" x="44" y="110" width="198.5" height="96" rx="3"/><text class="step" x="58" y="101">01</text><text class="n" x="58" y="142">Task</text><text class="s" x="58" y="168">Your prompt, and the model you</text><text class="s" x="58" y="183">picked from your own roster.</text></g><g><rect class="card" x="268.5" y="110" width="198.5" height="96" rx="3"/><text class="step" x="282.5" y="101">02</text><text class="n" x="282.5" y="142">Route</text><text class="s" x="282.5" y="168">Local or hosted. Keys are</text><text class="s" x="282.5" y="183">reported present or absent,</text><text class="s" x="282.5" y="198">never read out.</text></g><g><rect class="card" x="493" y="110" width="198.5" height="96" rx="3"/><text class="step" x="507" y="101">03</text><text class="n" x="507" y="142">Tool request</text><text class="s" x="507" y="168">The model asks to read, write,</text><text class="s" x="507" y="183">run a command, or call a</text><text class="s" x="507" y="198">companion tool.</text></g><g><rect class="card" x="717.5" y="110" width="198.5" height="96" rx="3"/><text class="step" x="731.5" y="101">04</text><text class="n" x="731.5" y="142">Capability check</text><text class="s" x="731.5" y="168">The request is classified,</text><text class="s" x="731.5" y="183">then allowed or refused before</text><text class="s" x="731.5" y="198">anything runs.</text></g><g><rect class="card" x="44" y="302" width="198.5" height="96" rx="3"/><text class="step" x="58" y="293">05</text><text class="n" x="58" y="334">Execute</text><text class="s" x="58" y="360">The allowed call runs. Its</text><text class="s" x="58" y="375">arguments and its output are</text><text class="s" x="58" y="390">hashed.</text></g><g><rect class="card" x="268.5" y="302" width="198.5" height="96" rx="3"/><text class="step" x="282.5" y="293">06</text><text class="n" x="282.5" y="334">Receipt</text><text class="s" x="282.5" y="360">Capability, outcome, both</text><text class="s" x="282.5" y="375">hashes, and the hash of the</text><text class="s" x="282.5" y="390">receipt before it.</text></g><g><rect class="card" x="493" y="302" width="198.5" height="96" rx="3"/><text class="step" x="507" y="293">07</text><text class="n" x="507" y="334">Ledger</text><text class="s" x="507" y="360">Receipts form an ordered</text><text class="s" x="507" y="375">chain. One broken link is</text><text class="s" x="507" y="390">visible from either end.</text></g><g><rect class="card" x="717.5" y="302" width="198.5" height="96" rx="3"/><text class="step" x="731.5" y="293">08</text><text class="n" x="731.5" y="334">Recheck</text><text class="s" x="731.5" y="360">Recompute the chain later with</text><text class="s" x="731.5" y="375">no network and no model in the</text><text class="s" x="731.5" y="390">loop.</text></g><path class="thin" d="M816.75 398V448"/><path class="thin" d="M816.75 448H180.67V472"/><rect x="44" y="472" width="273.33" height="46" rx="3" fill="none" stroke="var(--verified)" stroke-width="1.6"/><text class="n" x="58" y="493" font-size="13">MATCH</text><text class="s" x="58" y="509" font-size="10.5">the chain recomputes</text><path class="thin" d="M816.75 448H480V472"/><rect x="343.33" y="472" width="273.33" height="46" rx="3" fill="none" stroke="var(--drift)" stroke-width="1.6"/><text class="n" x="357.33" y="493" font-size="13">CHANGED</text><text class="s" x="357.33" y="509" font-size="10.5">a link no longer agrees</text><path class="thin" d="M816.75 448H779.33V472"/><rect x="642.67" y="472" width="273.33" height="46" rx="3" fill="none" stroke="var(--muted)" stroke-width="1.6"/><text class="n" x="656.67" y="493" font-size="13">UNVERIFIABLE</text><text class="s" x="656.67" y="509" font-size="10.5">the evidence is missing</text><text class="s" x="44" y="546">Every stage writes a receipt. The last stage needs no network and no model.</text></svg>
