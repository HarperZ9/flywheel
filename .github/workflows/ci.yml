# CI: every push and PR proves the gates the repo promises -- analyze clean,
# tests green, and the Windows release exe actually compiles.
name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.44.6
          cache: true

      - name: Analyze
        run: flutter analyze

      - name: Test
        run: flutter test

      - name: Build Windows release
        run: flutter build windows --release

      - name: Keep the built app for inspection
        uses: actions/upload-artifact@v4
        with:
          name: flywheel-desktop-release
          path: build/windows/x64/runner/Release/
          retention-days: 7
