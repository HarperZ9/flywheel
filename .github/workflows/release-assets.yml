name: release-assets

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Optional tag name to attach assets to (dry-run artifact upload if omitted)"
        required: false
        default: ""

permissions:
  contents: write

jobs:
  package-wheel-and-installers:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@0b93645e9fea7318ecaed2b359559ac225c90a2b # v5.3.0
        with:
          python-version: "3.12"
      - name: Self-test shell installer
        run: sh install.sh --self-test
      - name: Build wheel, sdist, and SHA256SUMS
        run: |
          python -m pip install --upgrade build
          python -m build
          cp install.ps1 install.sh dist/
          (cd dist && sha256sum flywheel_verify-*.whl flywheel_verify-*.tar.gz install.ps1 install.sh > SHA256SUMS)
          cat dist/SHA256SUMS
      - name: Smoke-test 1-command install from freshly built wheel
        run: |
          sh install.sh --from-dir dist --method venv --install-dir "$RUNNER_TEMP/fw-smoke/venv" --bin-dir "$RUNNER_TEMP/fw-smoke/bin" --no-path
          "$RUNNER_TEMP/fw-smoke/bin/flywheel" gate
      - name: Upload release assets artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: flywheel-release-assets
          path: dist/*
      - name: Attach assets to GitHub Release on tag push
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="${GITHUB_REF_NAME}"
          gh release view "$TAG" >/dev/null 2>&1 || gh release create "$TAG" --title "Flywheel $TAG" --generate-notes
          gh release upload "$TAG" dist/* --clobber
