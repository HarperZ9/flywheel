# Flywheel's release media: when a release is published, raw-native's media engine
# renders docs/media/media.json at the release tag on a hosted runner (CPU WebGPU,
# 960 x 540, captions, no narration) and attaches the videos and interactive bundles
# to the release. The narrated 4K render is made on the author's machine and replaces
# them (raw-native docs/architecture/adr/0012-media-engine.md).
name: release-media
on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag: { description: "Release tag", required: true, type: string }
permissions:
  contents: write
jobs:
  media:
    uses: HarperZ9/raw-native/.github/workflows/media.yml@d4b52740bb280d683a1330133fd45b38d4f34256  # raw-native main, 2026-10-09; bump at its next release
    with:
      tag: ${{ github.event.release.tag_name || inputs.tag }}
      setup: false
      engine_ref: d4b52740bb280d683a1330133fd45b38d4f34256
