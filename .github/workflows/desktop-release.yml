# Desktop release CANDIDATE: one version tag (v*) builds the whole
# platform from the tag's own commit and stages the artifact with a hash receipt
# as a workflow artifact. This workflow has READ-ONLY repository
# permission and never creates or touches a GitHub Release: publishing
# is a separate operation using the candidate's verified hash receipt. The
# reusable windows-publish.yml requires an explicit caller. The tag
# must match desktop/pubspec.yaml AND pyproject.toml at that commit;
# drift fails the run instead of shipping a mislabeled artifact.
name: desktop-release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing v* tag to rebuild (defaults to v<pubspec version>)"
        required: false

permissions:
  contents: read

jobs:
  installer:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Resolve tag and check out its commit
        id: ver
        shell: pwsh
        run: |
          if ("${{ github.event_name }}" -eq "push") {
            $tag = "${{ github.ref_name }}"
          } elseif ("${{ github.event.inputs.tag }}") {
            $tag = "${{ github.event.inputs.tag }}"
          } else {
            $line = (Get-Content desktop\pubspec.yaml | Where-Object { $_ -match '^version:' } | Select-Object -First 1)
            $pub = ($line -replace 'version:\s*', '' -split '\+')[0].Trim()
            if (-not $pub) { throw "could not read version from desktop\pubspec.yaml" }
            $tag = "v$pub"
          }
          if ("${{ github.event_name }}" -ne "push") {
            # The build source is the tag's commit, never the dispatched ref.
            git fetch origin "refs/tags/${tag}:refs/tags/${tag}"
            if ($LASTEXITCODE -ne 0) { throw "tag $tag does not exist on origin -- push the release tag first" }
            git checkout --detach "refs/tags/$tag"
            if ($LASTEXITCODE -ne 0) { throw "could not check out $tag" }
          }
          # Version comes from the tree being built (the tag's own pubspec).
          $line = (Get-Content desktop\pubspec.yaml | Where-Object { $_ -match '^version:' } | Select-Object -First 1)
          $pub = ($line -replace 'version:\s*', '' -split '\+')[0].Trim()
          if (-not $pub) { throw "could not read version from desktop\pubspec.yaml at $tag" }
          "tag=$tag" | Out-File -Append $env:GITHUB_OUTPUT -Encoding ascii
          "version=$pub" | Out-File -Append $env:GITHUB_OUTPUT -Encoding ascii
          Write-Output "shipping $tag (pubspec $pub, commit $(git rev-parse HEAD))"

      - name: Populate the tag-pinned Relay payload
        shell: pwsh
        run: |
          git submodule update --init --recursive
          if ($LASTEXITCODE -ne 0) { throw "tag-pinned submodule checkout failed" }
          git submodule status --recursive
          python scripts/check_bundled_lane_descriptors.py --lane relay --strict
          if ($LASTEXITCODE -ne 0) { throw "bundled Relay descriptor gate failed" }

      - name: Gate | one version across tag, pubspec, pyproject
        shell: pwsh
        run: |
          $tag = "${{ steps.ver.outputs.tag }}".TrimStart("v")
          $pub = "${{ steps.ver.outputs.version }}"
          $py = (Select-String -Path pyproject.toml -Pattern '^version = "(.+)"').Matches[0].Groups[1].Value
          if ($tag -ne $pub) { throw "tag v$tag does not match pubspec version $pub -- refusing to ship a mislabeled artifact" }
          if ($py -ne $pub) { throw "pyproject version $py does not match pubspec version $pub -- one platform, one version" }
          Write-Output "version gate: tag v$tag == pubspec $pub == pyproject $py"

      - uses: subosito/flutter-action@6292cfc21e60a8e80b17aa5c8c44be81236112f8 # v2.12.0
        with:
          channel: stable
          flutter-version: 3.44.6
          cache: true

      - uses: actions/setup-python@0b93645e9fea7318ecaed2b359559ac225c90a2b # v5.3.0
        with:
          python-version: "3.12"

      - name: Install freeze dependencies
        shell: pwsh
        run: |
          python -m pip install pyinstaller==6.21.0 ".[signing]"
          @'
          import importlib.metadata as md

          print("freeze dependency pyinstaller=" + md.version("pyinstaller"))
          print("freeze dependency cryptography=" + md.version("cryptography"))
          '@ | python -

      - name: Stage Studio runtime payload
        shell: pwsh
        run: |
          $sources = "packaging\studio-runtime-sources.json"
          $workRoot = Join-Path $env:RUNNER_TEMP "flywheel-studio-runtime-sources"
          $manifest = Join-Path $env:RUNNER_TEMP "studio-body-runtime-manifest.json"
          $payload = Join-Path $env:RUNNER_TEMP "flywheel-studio-runtime-payload"
          python -m scripts.studio_runtime_packaging stage-pinned-payload `
            --sources $sources `
            --work-root $workRoot `
            --manifest $manifest `
            --payload-root $payload
          if ($LASTEXITCODE -ne 0) { throw "Studio runtime payload staging failed" }
          "FLYWHEEL_STUDIO_BODY_RUNTIME_MANIFEST=$manifest" | Out-File -Append $env:GITHUB_ENV -Encoding ascii
          "FLYWHEEL_STUDIO_BODY_RUNTIME_PAYLOAD=$payload" | Out-File -Append $env:GITHUB_ENV -Encoding ascii

      - name: Stage Python lane source payloads
        shell: pwsh
        run: |
          $sourceRoot = Join-Path $env:RUNNER_TEMP "flywheel-python-lane-sources"
          $receipt = Join-Path $env:RUNNER_TEMP "python-lane-source-stage.json"
          python scripts/stage_python_lane_sources.py `
            --all `
            --source-root $sourceRoot `
            --receipt $receipt
          if ($LASTEXITCODE -ne 0) { throw "Python lane source staging failed" }
          "FLYWHEEL_PYTHON_LANE_SOURCE_ROOT=$sourceRoot" | Out-File -Append $env:GITHUB_ENV -Encoding ascii

      - name: Stage Node lane payloads
        shell: pwsh
        run: |
          # The gateway spec refuses to freeze without the staged Node lanes
          # (scripts/frozen_payload_datas.py); they ship under _internal/node-lanes.
          $nodeStageRoot = Join-Path $env:RUNNER_TEMP "flywheel-node-lanes"
          python scripts/stage_node_lanes.py --stage-root $nodeStageRoot
          if ($LASTEXITCODE -ne 0) { throw "Node lane staging failed" }
          "FLYWHEEL_NODE_LANE_STAGE_ROOT=$nodeStageRoot" | Out-File -Append $env:GITHUB_ENV -Encoding ascii

      - name: Ensure Inno Setup
        shell: pwsh
        run: |
          $iscc = @(
            "C:\Program Files (x86)\Inno Setup 6\ISCC.exe",
            "C:\Program Files\Inno Setup 6\ISCC.exe"
          ) | Where-Object { Test-Path $_ } | Select-Object -First 1
          if (-not $iscc) { choco install innosetup -y --no-progress }

      - name: Freeze and check the engine before packaging
        shell: pwsh
        run: |
          python -m PyInstaller packaging/flywheel-gateway.spec --noconfirm
          if ($LASTEXITCODE -ne 0) { throw "PyInstaller failed" }
          python scripts/check_frozen_gateway.py --executable dist/flywheel-gateway/flywheel-gateway.exe --expected-version "${{ steps.ver.outputs.version }}" --receipt build/frozen-gateway-smoke.json
          if ($LASTEXITCODE -ne 0) { throw "frozen gateway smoke failed" }
          $articulateVersion = python -c "from harness.lanes_registry import LANES; print(LANES['articulate'].version)"
          if ($LASTEXITCODE -ne 0) { throw "could not read pinned Articulate version" }
          python scripts/check_frozen_articulate.py --executable dist/flywheel-gateway/flywheel-gateway.exe --expected-version $articulateVersion --receipt build/frozen-articulate-smoke.json
          if ($LASTEXITCODE -ne 0) { throw "frozen local Articulate protocol failed" }
          python scripts/check_frozen_tool_mcp.py --executable dist/flywheel-gateway/flywheel-gateway.exe --expected-version "${{ steps.ver.outputs.version }}" --receipt build/frozen-tool-mcp-smoke.json
          if ($LASTEXITCODE -ne 0) { throw "frozen restricted Flywheel protocol failed" }
          New-Item -ItemType Directory -Force desktop/build/engine | Out-Null
          if (Test-Path -LiteralPath desktop/build/engine/flywheel-gateway) { throw "engine staging destination already exists" }
          Copy-Item -LiteralPath dist/flywheel-gateway -Destination desktop/build/engine/flywheel-gateway -Recurse

      - name: Gates + build + package
        env:
          FLYWHEEL_HOME: ${{ runner.temp }}/flywheel-flutter-home
        shell: pwsh
        working-directory: desktop
        run: |
          flutter analyze
          if ($LASTEXITCODE -ne 0) { throw "analyze failed" }
          flutter test
          if ($LASTEXITCODE -ne 0) { throw "tests failed" }
          powershell -NoProfile -ExecutionPolicy Bypass -File scripts\build_installer.ps1 -SkipEngine

      - name: SHA-256 receipt
        shell: pwsh
        run: |
          $exe = Get-ChildItem desktop\build\installer\Flywheel-Setup-*.exe | Select-Object -First 1
          $hash = (Get-FileHash $exe.FullName -Algorithm SHA256).Hash.ToLower()
          "$hash  $($exe.Name)" | Out-File -Encoding ascii desktop\build\installer\SHA256SUMS.txt
          Get-Content desktop\build\installer\SHA256SUMS.txt

      - name: Build the matching plugin and skill candidates
        shell: pwsh
        run: |
          python -m pip install pytest
          if ($LASTEXITCODE -ne 0) { throw "plugin test dependency installation failed" }
          python -m pytest tests/test_skill_bundles.py -q
          if ($LASTEXITCODE -ne 0) { throw "plugin bundle tests failed" }
          python scripts/build_skill_bundle.py --out desktop/build/installer/plugins
          if ($LASTEXITCODE -ne 0) { throw "plugin bundle build failed" }
          Copy-Item desktop/build/installer/plugins/SHA256SUMS desktop/build/installer/plugins/plugin-SHA256SUMS.txt
          $receiptHash = (Get-FileHash desktop/build/installer/plugins/plugin-SHA256SUMS.txt -Algorithm SHA256).Hash.ToLower()
          python scripts/build_skill_bundle.py --verify desktop/build/installer/plugins/plugin-SHA256SUMS.txt --accepted-sha256 $receiptHash
          if ($LASTEXITCODE -ne 0) { throw "plugin bundle verification failed" }
          "plugins_sha256=$receiptHash" | Out-File -Append $env:GITHUB_STEP_SUMMARY -Encoding ascii

      - name: Build and qualify the matching native MCPB companion
        shell: pwsh
        run: |
          python -m pytest tests/test_tool_mcp.py tests/test_native_mcp_bundle.py tests/test_frozen_tool_mcp_check.py -q
          if ($LASTEXITCODE -ne 0) { throw "native companion tests failed" }
          python scripts/build_native_mcp_bundle.py --engine dist/flywheel-gateway --installer-engine desktop/build/engine/flywheel-gateway --collect-toc build/flywheel-gateway/COLLECT-00.toc --out desktop/build/installer/native-mcp
          if ($LASTEXITCODE -ne 0) { throw "native MCPB build failed" }
          $native = Get-ChildItem desktop/build/installer/native-mcp/*.mcpb | Select-Object -First 1
          python scripts/check_native_mcp_bundle.py --archive $native.FullName --expected-version "${{ steps.ver.outputs.version }}" --receipt build/native-mcpb-smoke.json
          if ($LASTEXITCODE -ne 0) { throw "extracted native MCPB qualification failed" }
          $nativeReceiptHash = (Get-FileHash desktop/build/installer/native-mcp/native-MCPB-SHA256SUMS.txt -Algorithm SHA256).Hash.ToLower()
          python scripts/build_native_mcp_bundle.py --verify desktop/build/installer/native-mcp/native-MCPB-SHA256SUMS.txt --accepted-sha256 $nativeReceiptHash --version "${{ steps.ver.outputs.version }}"
          if ($LASTEXITCODE -ne 0) { throw "native MCPB hash verification failed" }
          "native_mcp_sha256=$nativeReceiptHash" | Out-File -Append $env:GITHUB_STEP_SUMMARY -Encoding ascii

      - name: Assemble a stable candidate directory
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path build/windows-release-candidate/plugins -Force | Out-Null
          New-Item -ItemType Directory -Path build/windows-release-candidate/native-mcp -Force | Out-Null
          Copy-Item desktop/build/installer/Flywheel-Setup-*.exe build/windows-release-candidate/
          Copy-Item desktop/build/installer/SHA256SUMS.txt build/windows-release-candidate/
          Copy-Item build/frozen-gateway-smoke.json build/windows-release-candidate/
          Copy-Item build/frozen-articulate-smoke.json build/windows-release-candidate/
          Copy-Item build/frozen-tool-mcp-smoke.json build/windows-release-candidate/
          Copy-Item build/native-mcpb-smoke.json build/windows-release-candidate/
          Copy-Item desktop/build/installer/native-mcp/*.mcpb build/windows-release-candidate/native-mcp/
          Copy-Item desktop/build/installer/native-mcp/native-MCPB-SHA256SUMS.txt build/windows-release-candidate/native-mcp/
          Copy-Item desktop/build/installer/plugins/*.zip build/windows-release-candidate/plugins/
          Copy-Item desktop/build/installer/plugins/plugin-SHA256SUMS.txt build/windows-release-candidate/plugins/

      - name: Stage the candidate artifact
        uses: actions/upload-artifact@b4b15b8c7c6ac21ea08fcf65892d2ee8f75cf882 # v4.4.3
        with:
          name: windows-installer-candidate
          path: build/windows-release-candidate/
          if-no-files-found: error
          retention-days: 14
