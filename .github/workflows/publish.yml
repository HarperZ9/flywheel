name: publish

# Publish flywheel-verify to PyPI via Trusted Publishing (OIDC).
# No API token is stored anywhere: GitHub mints a short-lived OIDC identity and
# PyPI trades it for a one-time upload credential. Triggered by pushing a
# version tag, e.g. `v0.3.0`.
#
# One-time PyPI setup (done in the PyPI web UI, by the project owner):
#   PyPI -> Account -> Publishing -> add a pending trusted publisher:
#     Owner:            HarperZ9
#     Repository:       flywheel
#     Workflow name:    publish.yml
#     Environment:      (leave blank)
#   Project name to reserve: flywheel-verify

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  build:
    name: Build sdist and wheel
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Build
        run: |
          python -m pip install --upgrade build
          python -m build
      - name: Check metadata
        run: |
          python -m pip install --upgrade twine
          python -m twine check dist/*
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  publish:
    name: Publish to PyPI
    needs: build
    runs-on: ubuntu-latest
    permissions:
      id-token: write   # required for Trusted Publishing (OIDC); no token needed
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
