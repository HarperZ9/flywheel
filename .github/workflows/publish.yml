name: publish

# Publish flywheel-verify to PyPI via Trusted Publishing (OIDC).
# No API token is stored anywhere: GitHub mints a short-lived OIDC identity and
# PyPI trades it for a one-time upload credential. Triggered by pushing a
# version tag, e.g. `v0.3.0`.
#
# One-time PyPI setup (done in the PyPI web UI, by the project owner):
#   PyPI -> Account -> Publishing -> add a pending trusted publisher:
#     Owner:            HarperZ9
#     Repository:       flywheel
#     Workflow name:    publish.yml
#     Environment:      (leave blank)
#   Project name to reserve: flywheel-verify

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  build:
    name: Build sdist and wheel
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@0b93645e9fea7318ecaed2b359559ac225c90a2b # v5.3.0
        with:
          python-version: "3.11"
      - name: Build
        run: |
          python -m pip install --upgrade build
          python -m build
      - name: Check metadata
        run: |
          python -m pip install --upgrade twine
          python -m twine check dist/*
      - uses: actions/upload-artifact@b4b15b8c7c6ac21ea08fcf65892d2ee8f75cf882 # v4.4.3
        with:
          name: dist
          path: dist/

  publish:
    name: Publish to PyPI
    needs: build
    runs-on: ubuntu-latest
    permissions:
      id-token: write   # required for Trusted Publishing (OIDC); no token needed
    steps:
      - uses: actions/download-artifact@fa0a91b85d4f404e444e00e005971372dc801d16 # v4.1.8
        with:
          name: dist
          path: dist/
      # Pinned by SHA, and the pin has to be kept current. The publish
      # container runs its own twine against its own locked SPDX license
      # list, which is not the twine the build job installs above. v1.12.4
      # (2025-01-24) carried a list old enough to reject FSL-1.1-MIT, so the
      # v0.3.11 upload failed the container check after the build job's fresh
      # twine had already passed it -- on metadata byte-identical to the
      # 0.3.10 wheel PyPI itself accepted. A stale pin here fails a release
      # at the last step, with the package unchanged.
      - uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
