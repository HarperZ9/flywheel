# Desktop CI: analyze + widget tests on the fast runner, plus the Windows
# release-exe compile proof (the break class ubuntu analyze/test cannot see).
# Path-filtered so engine-only changes stay on the Python pipeline.
# desktop-release.yml repeats the gates on windows-latest before packaging.
name: desktop-ci

on:
  push:
    branches: [main]
    paths: ["desktop/**", ".github/workflows/desktop-ci.yml"]
  pull_request:
    paths: ["desktop/**", ".github/workflows/desktop-ci.yml"]

  # Lets you ask for a build of the current main without pushing to it, and
  # without a release tag.
  workflow_dispatch:

permissions:
  contents: read

# This file compiles a Windows release exe, which is the slowest leg in the
# repository and runs on the runner class there is least of. Pushing twice to a
# branch with a PR open left the first compile running for a commit nobody
# would merge, holding the runner the second commit needed.
#
# The key names the event so the three lanes never cancel each other. A
# workflow_dispatch build is something a person asked for and a pull_request
# run ending it would be wrong.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  # A commit on main keeps its verdict whatever lands next, and the same holds
  # for a build somebody asked for by hand, since both resolve to main here.
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  flutter:
    # Analyze + test on both hosts. The product ships as a Windows installer,
    # so the tests must pass on windows-latest -- ubuntu alone cannot see the
    # Windows-only path break class (8.3 short names, backslashes, case-fold).
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: desktop
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@0b93645e9fea7318ecaed2b359559ac225c90a2b # v5.3.0
        with:
          python-version: "3.12"
      - uses: subosito/flutter-action@6292cfc21e60a8e80b17aa5c8c44be81236112f8 # v2.12.0
        with:
          channel: stable
          flutter-version: 3.44.6
          cache: true
      - run: flutter pub get
      - run: flutter test test/chat_context_lifecycle_test.dart --plain-name 'changed retained draft'
        env:
          FLYWHEEL_HOME: ${{ runner.temp }}/flywheel-flutter-home

      - name: Preserve failed golden comparisons
        if: failure()
        uses: actions/upload-artifact@b4b15b8c7c6ac21ea08fcf65892d2ee8f75cf882 # v4.4.3
        with:
          name: flutter-golden-failures-${{ matrix.os }}-${{ github.sha }}
          path: desktop/test/failures/
          if-no-files-found: ignore
          retention-days: 7

