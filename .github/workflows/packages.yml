name: packages

# Each folder under packages/ is a tool that keeps its own pyproject or
# package.json and its own tests. This file runs those tests, and only when a
# pull request or a push to main touches packages/ or this file, so the main
# suite's time does not grow. The commands are the ones each tool's CI ran in
# the repository it came from.

on:
  push:
    branches: [main]
    paths:
      - "packages/**"
      - ".github/workflows/packages.yml"
  pull_request:
    paths:
      - "packages/**"
      - ".github/workflows/packages.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  python:
    # The install step below adds pytest-timeout before any test command in
    # this matrix runs: the repository's pytest.ini passes --timeout, and a
    # package with no pytest settings of its own inherits it.
    name: ${{ matrix.package }}${{ matrix.python && format(' (python {0})', matrix.python) || '' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          # A row may name a Python version. Rows without one run on 3.12.
          # chorus ran on 3.10 and 3.12 in its own repository; this is the 3.10 leg.
          - package: chorus
            python: "3.10"
            install: python -m pip install -e . pytest
            test: python -m pytest -q
          - package: proof-surface
            install: python -m pip install -e ".[test]"
            test: |
              python -m pytest -q
              python scripts/check_public_surface.py
              python verify_bundle.py examples/agent_action/demo-otel-out
          - package: proof-surface-report
            install: |
              python -m pip install ../proof-surface
              python -m pip install -e ".[test]"
            test: python -m pytest -q
          - package: repo-proof-index
            install: python -m pip install -e ".[test]"
            test: |
              python -m pytest
              python scripts/check_proof_surface_conformance.py
              python scripts/score_proof_surface_research.py
          - package: model-provenance-validator
            install: python -m pip install -e ".[test]"
            test: |
              python -m pytest
              model-provenance-validator examples/envelopes/release.provenance.json --proof-packet
          - package: context-curator-lite
            install: python -m pip install -e ".[test]"
            test: python -m pytest
          - package: secret-redact-io
            install: python -m pip install -e ".[dev]"
            test: |
              python -m pytest
              python scripts/check_public_surface.py
          - package: agent-hook-pack
            install: python -m pip install -e ".[test]"
            test: python -m pytest
          - package: agent-routing-kit
            install: python -m pip install -e . pytest
            test: python -m pytest -q
          - package: public-surface-sweeper
            install: python -m pip install -e ".[test]"
            test: |
              python -m pytest
              public-surface-sweeper examples/clean-repo --proof-packet
          - package: discover
            install: python -m pip install -e .
            test: |
              python -m unittest discover -s tests -t . -v
              python -m discover video examples/video-manifest.json --gate
          - package: coherence-membrane
            install: |
              sudo apt-get update && sudo apt-get install -y xvfb
              python -m pip install -e ".[test]"
            test: |
              xvfb-run -a python -m pytest -q
              python -m coherence_membrane selftest
              python conformance/run.py
              node impl/js/run.js
          - package: behavior-transform.io
            install: python -m pip install pytest
            test: |
              python -m pytest -q
              python tools/check_repo_facts.py
              python tools/check_repo_art.py
              python tools/behavior_flagship.py doctor --json
          - package: chorus
            install: python -m pip install -e . pytest
            test: |
              python -m pytest -q
              python tools/check_repo_art.py
          - package: plexus
            install: python -m pip install -e ".[test]"
            test: |
              python -m pytest -q
              python examples/tour.py
          - package: mneme
            install: python -m pip install -e ".[test]"
            test: |
              python -m pytest -q
              python examples/tour.py
          - package: relay
            install: python -m pip install -e ".[test]"
            test: |
              python -m pytest -q
              python tools/check_release_metadata.py
          # canon's own repo-art job: the drawings match their spec, and a fresh
          # render leaves the committed files unchanged.
          - package: canon
            install: python -m pip install -e ".[dev]"
            test: |
              python -m pytest
              python tools/check_repo_art.py
              python tools/render_repo_art.py
              git diff --exit-code -- .
          # index's CI ran Linux on Python 3.12: its suite, then the compat suite.
          - package: index
            install: python -m pip install -e ".[test]"
            test: |
              python -m pytest
              python -m pytest compat/workspace-repo-map/tests -q
          # crucible's CI ran Linux on Python 3.11 and 3.12, each with every step
          # below: lint, type check, tests with the coverage floor, the demo, the
          # version check, the build, and a smoke run of the built wheel.
          - package: crucible
            python: "3.11"
            install: python -m pip install -e ".[dev]"
            test: |
              ruff check src tests examples
              mypy src/crucible
              pytest -q --cov=crucible --cov-report=term-missing --cov-fail-under=85
              python examples/demo.py
              python scripts/check_version_sites.py .
              python -m build
              python -m twine check dist/*
              python scripts/smoke_wheel.py dist/*.whl
          - package: crucible
            python: "3.12"
            install: python -m pip install -e ".[dev]"
            test: |
              ruff check src tests examples
              mypy src/crucible
              pytest -q --cov=crucible --cov-report=term-missing --cov-fail-under=85
              python examples/demo.py
              python scripts/check_version_sites.py .
              python -m build
              python -m twine check dist/*
              python scripts/smoke_wheel.py dist/*.whl
    defaults:
      run:
        shell: bash
        working-directory: packages/${{ matrix.package }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@0b93645e9fea7318ecaed2b359559ac225c90a2b # v5.3.0
        with:
          python-version: ${{ matrix.python || '3.12' }}
      - name: Install from packages/${{ matrix.package }}
        run: |
          python -m pip install --upgrade pip pytest-timeout
          ${{ matrix.install }}
      - name: The package's own tests
        run: ${{ matrix.test }}
      - name: Art receipt digests
        if: ${{ hashFiles(format('packages/{0}/scripts/check_art_receipts.py', matrix.package)) != '' }}
        run: python scripts/check_art_receipts.py

  workflow-harness-lite:
    name: workflow-harness-lite
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: packages/workflow-harness-lite
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
      - run: npm test
      - run: npm pack --dry-run
      - run: python3 scripts/check_art_receipts.py

  accountable-engine:
    name: accountable-engine
    runs-on: windows-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: packages/accountable-engine
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: The critic script runs
        shell: pwsh
        run: powershell -NoProfile -ExecutionPolicy Bypass -File .\critic.ps1
      - run: python scripts/check_art_receipts.py

  terminal-state-fixtures:
    name: terminal-state-fixtures
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        shell: bash
        working-directory: packages/terminal-state-fixtures
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@0b93645e9fea7318ecaed2b359559ac225c90a2b # v5.3.0
        with:
          python-version: "3.12"
      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install datasets pytest pytest-timeout uv
          python -m pip install -e environments/mlflow_terminal_state
      - name: Test mlflow-terminal-state
        working-directory: packages/terminal-state-fixtures/environments/mlflow_terminal_state
        run: python -m pytest tests/ -q
      - name: Test the METR terminal-state TaskFamily
        # uv builds its own environment from the project's lock, with no
        # pytest-timeout in it, so the repository's addopts are cleared here.
        run: uv run --project environments/metr_terminal_state_runs python -m pytest -o addopts= environments/metr_terminal_state_runs/tests -q --task-standard-task-family-name metr_terminal_state_runs --task-standard-task-name run_000
      - name: The card and the artwork still match the code
        run: |
          python tools/check_repo_facts.py
          python tools/check_repo_art.py
          python scripts/check_art_receipts.py

  learn:
    # The same legs learn's CI ran in its own repository: three systems, Node 20 and 22.
    name: learn (${{ matrix.os }}, node ${{ matrix.node-version }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        node-version: ["20", "22"]
    defaults:
      run:
        shell: bash
        working-directory: packages/learn
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ matrix.node-version }}
      # The runtime needs only Node. Python is here because the artwork gates in
      # tools/ are Python, and the planted-package test needs 3.11 or later.
      - uses: actions/setup-python@0b93645e9fea7318ecaed2b359559ac225c90a2b # v5.3.0
        with:
          python-version: "3.11"
      - name: Test
        run: node --test
      - name: Doctor (self-test)
        run: node src/cli.mjs doctor
      - name: Status
        run: node src/cli.mjs status
      # Pack the tarball, install it into an empty folder and run its commands from there.
      - name: Pack the tarball and run it through npx
        run: |
          mkdir -p packed
          npm pack --pack-destination packed
          node scripts/smoke-tarball.mjs packed/harperz9-learn-"$(node -p "require('./package.json').version")".tgz
      - name: Art receipt digests
        if: runner.os == 'Linux' && matrix.node-version == '22'
        run: python scripts/check_art_receipts.py

  python-legs:
    # The other legs each tool's CI ran in its own repository. The python job
    # above already runs every package on Linux with Python 3.12, so that one
    # combination is left out here. A package joins by its name in `package`
    # and one `include` row with the extra command its CI ran after pytest.
    name: ${{ matrix.package }} (${{ matrix.os }}, python ${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        package: [plexus, mneme, relay, canon]
        os: [ubuntu-latest, windows-latest, macos-latest]
        python: ["3.11", "3.12", "3.13"]
        exclude:
          - os: ubuntu-latest
            python: "3.12"
          # canon's CI ran Linux and Windows only.
          - package: canon
            os: macos-latest
        include:
          - package: plexus
            extra: python examples/tour.py
          - package: mneme
            extra: python examples/tour.py
          - package: relay
            extra: python tools/check_release_metadata.py
          # canon names its test extra `dev` and ran nothing after pytest.
          - package: canon
            extras: dev
    defaults:
      run:
        shell: bash
        working-directory: packages/${{ matrix.package }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@0b93645e9fea7318ecaed2b359559ac225c90a2b # v5.3.0
        with:
          python-version: ${{ matrix.python }}
      - name: Install from packages/${{ matrix.package }}
        run: |
          python -m pip install --upgrade pip pytest-timeout
          python -m pip install -e ".[${{ matrix.extras || 'test' }}]"
      - name: The package's own tests
        run: python -m pytest -q
      - name: The command its CI ran after the tests
        if: ${{ matrix.extra }}
        run: ${{ matrix.extra }}

  python-wheel:
    # Build the wheel, install it in a clean venv and run the packaged
    # command, as each tool's CI did in its own repository.
    name: ${{ matrix.package }} (wheel)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        include:
          - package: plexus
            smoke: |
              /tmp/vc/bin/plexus --version
              /tmp/vc/bin/plexus discover --builtin > /dev/null
          - package: mneme
            smoke: |
              /tmp/vc/bin/mneme --version
              /tmp/vc/bin/mneme bench > /dev/null
          - package: relay
            smoke: |
              /tmp/vc/bin/relay --help > /dev/null
          - package: canon
            smoke: |
              /tmp/vc/bin/canon --help > /dev/null
              /tmp/vc/bin/canon-client --help > /dev/null
          - package: index
            smoke: |
              /tmp/vc/bin/index --version
              /tmp/vc/bin/index --help > /dev/null
          - package: forum
            smoke: |
              /tmp/vc/bin/forum --version
              /tmp/vc/bin/forum --help > /dev/null
          - package: articulate
            smoke: |
              /tmp/vc/bin/articulate --version
              /tmp/vc/bin/articulate --help > /dev/null
              printf '%s\n' '{"jsonrpc":"2.0","id":1,"method":"initialize","params":{"protocolVersion":"2024-11-05","capabilities":{},"clientInfo":{"name":"ci","version":"0"}}}' | /tmp/vc/bin/articulate-mcp | grep -q '"serverInfo"'
          - package: accountable-surface
            smoke: |
              /tmp/vc/bin/accountable-surface-authority --help > /dev/null
              printf '%s\n' '{"jsonrpc":"2.0","id":1,"method":"initialize","params":{"protocolVersion":"2024-11-05","capabilities":{},"clientInfo":{"name":"ci","version":"0"}}}' | /tmp/vc/bin/accountable-surface-mcp | grep -q '"serverInfo"'
    defaults:
      run:
        shell: bash
        working-directory: packages/${{ matrix.package }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@0b93645e9fea7318ecaed2b359559ac225c90a2b # v5.3.0
        with:
          python-version: "3.12"
      - name: Build the wheel
        run: |
          python -m pip install build
          python -m build
      - name: Install the wheel in a clean venv and run the packaged command
        run: |
          python -m venv /tmp/vc
          /tmp/vc/bin/pip install dist/*.whl
          ${{ matrix.smoke }}

  canon-client-package:
    # canon's own client-package job: build the source and the native client
    # package on Windows and run the acceptance checks the build script carries.
    name: canon (client package, windows)
    runs-on: windows-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: packages/canon
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@0b93645e9fea7318ecaed2b359559ac225c90a2b # v5.3.0
        with:
          python-version: "3.12"
      - run: python -m pip install -e ".[dev]" pyinstaller==6.21.0
      - name: source and native package acceptance
        shell: pwsh
        run: |
          $env:TEMP = (Get-Item -LiteralPath $env:RUNNER_TEMP).FullName
          $env:TMP = $env:TEMP
          python scripts/build_client_package.py "$env:RUNNER_TEMP/canon-source"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python scripts/build_client_package.py "$env:RUNNER_TEMP/canon-native" --native
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

  # emet's own conformance workflow, job for job: the Python reference, the
  # Rust, Node and Go implementations against the same vectors, the receipt
  # parity test across three languages, and the installed console script. The
  # EMET_SKIP_CAPABILITIES values are emet's own: they name the capabilities
  # each later implementation does not have yet.
  emet-python-reference:
    name: emet (python reference)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        shell: bash
        working-directory: packages/emet
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@0b93645e9fea7318ecaed2b359559ac225c90a2b # v5.3.0
        with:
          python-version: "3.12"
      - name: behavior proof (membrane)
        run: python test_membrane.py
      - name: corpus unit tests
        run: python test_corpus.py
      - name: monitor behavior tests
        run: python test_monitor.py
      - name: organs behavior tests
        run: python test_organs.py
      - name: forward delivery contract
        run: python test_forward_delivery_contract.py
      - name: front-page artwork re-renders to the committed bytes
        run: python test_repo_art.py
      - name: proof surface receipt test
        run: python test_proof_surface_receipt.py
      - name: portable witness receipt behavior proof
        run: python test_witness_receipt.py
      - name: stripped-credential rebind behavior proof
        run: python test_rebind.py
      - name: DeepEval eval-receipt reporter behavior proof
        run: python test_deepeval_reporter.py
      - name: Flywheel evaluation artifact witness controls
        run: python test_reporter_flywheel.py
      - name: conformance, Python reference (expect 48 of 48)
        run: python conformance/run.py membrane.py
      - name: selftest re-derives its own identity
        run: python membrane.py selftest
      - name: proof surface receipt adapter emits a closed-lattice receipt
        run: |
          python membrane.py anchor README.md
          python adapters/proof_surface_receipt.py verify README.md anchors.json > receipt.json
          python - <<'PY'
          import json
          data = json.load(open("receipt.json", encoding="utf-8"))
          assert data["receipt_id"].startswith("emet-verify-")
          assert data["verdict"] in {"MATCH", "DRIFT", "UNVERIFIABLE"}
          assert "TRUSTED" not in json.dumps(data)
          PY
      - name: rationale walkthrough transcript is re-derivable
        run: python test_walkthrough.py
      - name: Art receipt digests
        run: python scripts/check_art_receipts.py

  emet-rust:
    name: emet (rust implementation)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        shell: bash
        working-directory: packages/emet
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@0b93645e9fea7318ecaed2b359559ac225c90a2b # v5.3.0
        with:
          python-version: "3.12"
      - name: build the rust implementation
        run: rustc -O impl/rust/emet.rs -o impl/rust/emet
      - name: rust receipt behavior tests
        run: cargo test --release --manifest-path impl/rust/Cargo.toml
      - name: conformance, Rust (expect 40 of 40)
        run: python conformance/run.py impl/rust/emet
        env:
          EMET_SKIP_CAPABILITIES: rebind,eval-receipt

  emet-js:
    name: emet (node implementation)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        shell: bash
        working-directory: packages/emet
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
      - uses: actions/setup-python@0b93645e9fea7318ecaed2b359559ac225c90a2b # v5.3.0
        with:
          python-version: "3.12"
      - name: node receipt behavior tests
        run: node --test impl/js/test_receipt.js
      - name: conformance, Node.js (expect 40 of 40)
        run: python conformance/run.py impl/js/emet.js
        env:
          EMET_SKIP_CAPABILITIES: rebind,eval-receipt

  emet-go:
    name: emet (go implementation)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        shell: bash
        working-directory: packages/emet
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5 # v5.5.0
        with:
          go-version: "1.23"
          cache: false
      - uses: actions/setup-python@0b93645e9fea7318ecaed2b359559ac225c90a2b # v5.3.0
        with:
          python-version: "3.12"
      - name: build the go implementation
        run: CGO_ENABLED=0 go build -o impl/go/emet impl/go/emet.go
      - name: conformance, Go (expect 35 of 35)
        run: python conformance/run.py impl/go/emet
        env:
          EMET_SKIP_CAPABILITIES: receipt,rebind,eval-receipt

  emet-cross-lang:
    name: emet (receipt parity across languages)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        shell: bash
        working-directory: packages/emet
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@0b93645e9fea7318ecaed2b359559ac225c90a2b # v5.3.0
        with:
          python-version: "3.12"
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
      - name: build the rust implementation where the parity test looks first
        run: |
          mkdir -p impl/rust/target/release
          rustc -O impl/rust/emet.rs -o impl/rust/target/release/emet
      - name: receipt parity and the negatives that must fail (Python, Rust, Node)
        run: python test_witness_receipt_cross_lang.py
        env:
          EMET_REQUIRE_CROSS_LANG: "1"

  emet-packaging:
    name: emet (installed console script)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        shell: bash
        working-directory: packages/emet
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@0b93645e9fea7318ecaed2b359559ac225c90a2b # v5.3.0
        with:
          python-version: "3.12"
      - name: install the emet package
        run: python -m pip install .
      - name: the installed console script re-derives its own identity
        run: emet selftest
      - name: conformance against the installed console script (expect 48 of 48)
        run: python conformance/run.py "$(python -c 'import shutil; print(shutil.which("emet"))')"

  # forum's own CI, step for step: Linux and Windows on Python 3.11 to 3.13,
  # each with lint, the type check, the suite under its coverage floor and the
  # demo. The client-package test ran in forum's release workflow on a tag; it
  # runs here on every change.
  forum:
    name: forum (${{ matrix.os }}, python ${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ["3.11", "3.12", "3.13"]
    defaults:
      run:
        shell: bash
        working-directory: packages/forum
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@0b93645e9fea7318ecaed2b359559ac225c90a2b # v5.3.0
        with:
          python-version: ${{ matrix.python }}
      - name: Install from packages/forum
        run: |
          python -m pip install --upgrade pip pytest-timeout
          python -m pip install -e ".[dev]"
      - name: Lint
        run: ruff check src tests
      - name: Type check
        run: mypy src/forum
      - name: The package's own tests, under its coverage floor
        run: python -m pytest -q --cov=forum --cov-report=term-missing --cov-fail-under=85
      - name: The demo
        run: python examples/demo.py
      - name: The client-package test from its release workflow
        if: runner.os == 'Linux' && matrix.python == '3.12'
        run: python scripts/test_client_plugin.py
      - name: Art receipt digests
        if: runner.os == 'Linux' && matrix.python == '3.12'
        run: python scripts/check_art_receipts.py

  # accountable-surface's own CI: Windows, Python 3.12 and Node 24, with its two
  # siblings on the path. In its own repository the job cloned coherence-membrane
  # and proof-surface; here they are the folders beside it. The last step is
  # new: the authority command answers --help and each server answers an MCP
  # initialize request (the two servers take no flags).
  accountable-surface:
    name: accountable-surface (windows, python 3.12, node 24)
    runs-on: windows-latest
    timeout-minutes: 20
    defaults:
      run:
        shell: pwsh
        working-directory: packages/accountable-surface
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@0b93645e9fea7318ecaed2b359559ac225c90a2b # v5.3.0
        with:
          python-version: "3.12"
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
          package-manager-cache: false
      - name: Install from packages/accountable-surface
        run: |
          python -m pip install --upgrade pip pytest-timeout
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -m pip install -e ".[test,server]"
      - name: The package's own tests, with the sibling sources on the path
        run: |
          $env:PYTHONPATH = "$PWD\src;$PWD\..\coherence-membrane\src;$PWD\..\proof-surface\src"
          python -m pytest
      - name: Web tests
        shell: bash
        run: node --test web/*.test.mjs
      - name: Entry points answer
        shell: bash
        run: |
          accountable-surface-authority --help > /dev/null
          init='{"jsonrpc":"2.0","id":1,"method":"initialize","params":{"protocolVersion":"2024-11-05","capabilities":{},"clientInfo":{"name":"ci","version":"0"}}}'
          printf '%s\n' "$init" | accountable-surface-mcp | grep -q '"serverInfo"'
          printf '%s\n' "$init" | accountable-surface-server | grep -q '"serverInfo"'

  accountable-surface-art:
    name: accountable-surface (art receipts)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Art receipt digests
        working-directory: packages/accountable-surface
        run: python3 scripts/check_art_receipts.py

  # bulletin's own CI, step for step, on Node 24: types, the unit tests, the
  # check that post text reaches the page as text, and the assembled service
  # (a local Worker, the HTTP smoke, and the browser smoke against both the
  # backend face and the published site at the commit bulletin pins). Nothing
  # is deployed: wrangler runs with --local.
  bulletin:
    name: bulletin (node 24)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        shell: bash
        working-directory: packages/bulletin
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: pinned published website face
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          repository: HarperZ9/HarperZ9.github.io
          ref: 415d609feeaa5f8802cbc443044c30a76b5346cc
          path: packages/bulletin/.ci-portfolio
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: packages/bulletin/package-lock.json
      - run: npm ci
      - name: types
        run: npm run typecheck
      - name: the pieces
        run: npm test
      - name: the face writes text, never markup
        run: |
          if grep -rnE '\.(inner|outer)HTML\s*=|insertAdjacentHTML|document\.write\(' public/js/; then
            echo "::error::post text reaches the DOM through textContent only"
            exit 1
          fi
      - name: the assembled service
        env:
          WRANGLER_SEND_METRICS: "false"
        run: |
          cp wrangler.toml.example wrangler.toml
          npm run db:local
          npx wrangler dev --local --port 8787 --var BULLETIN_POW_BITS:12 &
          worker=$!
          trap 'kill $worker 2>/dev/null || true' EXIT
          for _ in $(seq 1 60); do
            curl -sf http://127.0.0.1:8787/.well-known/agent-board.json -o /dev/null && break
            sleep 1
          done
          node scripts/smoke.mjs --base http://127.0.0.1:8787
          export CHROME_PATH="$(command -v google-chrome || command -v chromium)"
          test -n "$CHROME_PATH"
          BULLETIN_CHROME_NO_SANDBOX=1 node scripts/smoke/media-cross-surface.mjs             --base http://127.0.0.1:8787             --backend-face             --log-dir "$RUNNER_TEMP/bulletin-media-cross-backend"
          BULLETIN_CHROME_NO_SANDBOX=1 node scripts/smoke/media-cross-surface.mjs             --base http://127.0.0.1:8787             --face-root "$PWD/.ci-portfolio"             --log-dir "$RUNNER_TEMP/bulletin-media-cross-website"
      - name: Art receipt digests
        run: python3 scripts/check_art_receipts.py

  # articulate's own CI, job for job. Linux on Python 3.9 to 3.12 and Windows
  # on 3.9 and 3.12 run the whole suite; the macOS job builds and smokes the
  # Claude plugin; the extras job installs the mcp and hosted extras.
  articulate:
    name: articulate (${{ matrix.os }}, python ${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        python: ["3.9", "3.10", "3.11", "3.12"]
        include:
          - os: windows-latest
            python: "3.9"
          - os: windows-latest
            python: "3.12"
    defaults:
      run:
        shell: bash
        working-directory: packages/articulate
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@0b93645e9fea7318ecaed2b359559ac225c90a2b # v5.3.0
        with:
          python-version: ${{ matrix.python }}
      - run: pip install -e ".[dev]"
      - name: The package's own tests
        run: python -m pytest -q

  articulate-macos-plugin:
    name: articulate (macos, plugin)
    runs-on: macos-latest
    timeout-minutes: 20
    defaults:
      run:
        shell: bash
        working-directory: packages/articulate
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@0b93645e9fea7318ecaed2b359559ac225c90a2b # v5.3.0
        with:
          python-version: "3.12"
      - run: pip install -e ".[dev]"
      - run: >-
          python -m pytest -q tests/test_tool_annotations.py
          tests/test_claude_plugin_bundle.py tests/test_claude_plugin_launch.py
          tests/test_local_mcp_plugin_surface.py tests/test_local_tools_stay_local.py
          tests/test_claude_plugin_claims.py tests/test_claude_plugin_scripts.py
          tests/test_claude_plugin_audit.py
      - run: python scripts/build_claude_plugin.py build/claude-plugin --dev
      - run: /usr/bin/python3 scripts/smoke_claude_plugin.py build/claude-plugin --command /usr/bin/python3

  articulate-extras:
    name: articulate (extras)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        shell: bash
        working-directory: packages/articulate
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@0b93645e9fea7318ecaed2b359559ac225c90a2b # v5.3.0
        with:
          python-version: "3.12"
      - run: pip install -e ".[dev,mcp,hosted]"
      - run: python -c "import fastmcp; print('fastmcp', fastmcp.__version__)"
      - run: python -m pytest -q tests/test_tool_annotations.py tests/test_hosted_mcp.py tests/test_house_mcp.py tests/test_local_mcp.py tests/test_mcp_editing.py tests/test_voice_mcp.py
      - run: python -m pytest -q

  # The pre-commit hook from a scratch repository, installed from the package
  # path. The configuration is examples/pre-commit-from-flywheel.yaml with its
  # address pointed at this checkout, so the subdirectory install is the thing
  # under test: a clean file commits, a file with a prose em-dash is refused.
  articulate-hook:
    name: articulate (pre-commit hook from the package path)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@0b93645e9fea7318ecaed2b359559ac225c90a2b # v5.3.0
        with:
          python-version: "3.12"
      - run: pip install pre-commit
      - name: The hook passes a clean file and blocks a prose em-dash
        run: |
          SRC="$GITHUB_WORKSPACE"
          REV="$(git -C "$SRC" rev-parse HEAD)"
          SCRATCH="$RUNNER_TEMP/scratch"
          mkdir "$SCRATCH" && cd "$SCRATCH"
          git init -q
          git config user.email ci@example.invalid
          git config user.name CI
          sed "s#git+https://github.com/HarperZ9/flywheel@REF#git+file://$SRC@$REV#" \
            "$SRC/packages/articulate/examples/pre-commit-from-flywheel.yaml" > .pre-commit-config.yaml
          grep -q "git+file://$SRC@$REV#subdirectory=packages/articulate" .pre-commit-config.yaml
          pre-commit install
          git add .pre-commit-config.yaml
          git commit -qm "config" --no-verify
          cp "$SRC/packages/articulate/tests/fixtures/action/clean.md" notes.md
          git add notes.md
          git commit -m "clean file" > clean.log 2>&1 || { cat clean.log; exit 1; }
          cat clean.log
          grep -q "Articulate writing check" clean.log
          grep -q "Passed" clean.log
          printf '# Plan\n\nThe release is ready \xe2\x80\x94 ship it today.\n' > blocked.md
          git add blocked.md
          if git commit -m "blocked file" > hook.log 2>&1; then
            cat hook.log; echo "the hook let a blocked file through"; exit 1
          fi
          cat hook.log
          grep -q "blocked.md" hook.log
          test "$(git log --format=%s -1)" = "clean file"

  # The GitHub Action from the package path, with its working-directory input:
  # a clean file with a committed content-free receipt passes and the receipt
  # is re-verified against its source, a drifted receipt fails, and the gate
  # input fails a blocked file. The SARIF file is written and checked here and
  # is not uploaded to this repository's code scanning.
  articulate-action:
    name: articulate (action from the package path)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: A clean file and its committed receipt pass
        uses: ./packages/articulate
        with:
          working-directory: packages/articulate
          files: tests/fixtures/action/*.md
          gate: "true"
          audit-path: tests/fixtures/action/receipts
          upload-sarif: "false"
      - name: The SARIF file exists and the receipt matched its source
        working-directory: packages/articulate
        run: |
          python -c "import json; d=json.load(open('articulate.sarif')); assert d['version']=='2.1.0' and d['runs'], d.keys()"
          python -m articulate.cli audit tests/fixtures/action/receipts --reverify > audit-clean.log 2>&1
          cat audit-clean.log
          grep -q "'Match': 1" audit-clean.log
      - name: Change the file after its receipt
        run: printf '\nA line added after the receipt.\n' >> packages/articulate/tests/fixtures/action/clean.md
      - name: A drifted receipt fails
        id: drift
        continue-on-error: true
        uses: ./packages/articulate
        with:
          working-directory: packages/articulate
          files: tests/fixtures/action/*.md
          audit-path: tests/fixtures/action/receipts
          upload-sarif: "false"
      - name: Write a blocked file
        run: |
          mkdir -p packages/articulate/ci-blocked/deep
          printf '# Plan\n\nThe release is ready \xe2\x80\x94 ship it today.\n' > packages/articulate/ci-blocked/deep/plan.md
      - name: A blocked file fails under the gate input
        id: blocked
        continue-on-error: true
        uses: ./packages/articulate
        with:
          working-directory: packages/articulate
          files: ci-blocked/**/*.md
          gate: "true"
          upload-sarif: "false"
      - name: Both negative runs failed, for the expected reasons
        working-directory: packages/articulate
        run: |
          test "${{ steps.drift.outcome }}" = failure
          test "${{ steps.blocked.outcome }}" = failure
          python -m articulate.cli audit tests/fixtures/action/receipts --reverify > audit.log 2>&1 || true
          cat audit.log
          grep -q "source-changed" audit.log
          python -m articulate.cli check ci-blocked/deep/plan.md --gate > gate.log 2>&1 || true
          cat gate.log
          grep -q "blocked" gate.log

  articulate-self-check:
    name: articulate (its own documents pass its own gate)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        shell: bash
        working-directory: packages/articulate
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@0b93645e9fea7318ecaed2b359559ac225c90a2b # v5.3.0
        with:
          python-version: "3.12"
      - run: pip install -e .
      - run: python -m articulate.cli check README.md CHANGELOG.md docs/*.md --gate
      - name: Art receipt digests
        run: python3 scripts/check_art_receipts.py
