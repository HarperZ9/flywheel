name: packages

# Each folder under packages/ is a tool that keeps its own pyproject or
# package.json and its own tests. This file runs those tests, and only when a
# pull request or a push to main touches packages/ or this file, so the main
# suite's time does not grow. The commands are the ones each tool's CI ran in
# the repository it came from.

on:
  push:
    branches: [main]
    paths:
      - "packages/**"
      - ".github/workflows/packages.yml"
  pull_request:
    paths:
      - "packages/**"
      - ".github/workflows/packages.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  python:
    # The install step below adds pytest-timeout before any test command in
    # this matrix runs: the repository's pytest.ini passes --timeout, and a
    # package with no pytest settings of its own inherits it.
    name: ${{ matrix.package }}${{ matrix.python && format(' (python {0})', matrix.python) || '' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          # A row may name a Python version. Rows without one run on 3.12.
          # chorus ran on 3.10 and 3.12 in its own repository; this is the 3.10 leg.
          - package: chorus
            python: "3.10"
            install: python -m pip install -e . pytest
            test: python -m pytest -q
          - package: proof-surface
            install: python -m pip install -e ".[test]"
            test: |
              python -m pytest -q
              python scripts/check_public_surface.py
              python verify_bundle.py examples/agent_action/demo-otel-out
          - package: proof-surface-report
            install: |
              python -m pip install ../proof-surface
              python -m pip install -e ".[test]"
            test: python -m pytest -q
          - package: repo-proof-index
            install: python -m pip install -e ".[test]"
            test: |
              python -m pytest
              python scripts/check_proof_surface_conformance.py
              python scripts/score_proof_surface_research.py
          - package: model-provenance-validator
            install: python -m pip install -e ".[test]"
            test: |
              python -m pytest
              model-provenance-validator examples/envelopes/release.provenance.json --proof-packet
          - package: context-curator-lite
            install: python -m pip install -e ".[test]"
            test: python -m pytest
          - package: secret-redact-io
            install: python -m pip install -e ".[dev]"
            test: |
              python -m pytest
              python scripts/check_public_surface.py
          - package: agent-hook-pack
            install: python -m pip install -e ".[test]"
            test: python -m pytest
          - package: agent-routing-kit
            install: python -m pip install -e . pytest
            test: python -m pytest -q
          - package: public-surface-sweeper
            install: python -m pip install -e ".[test]"
            test: |
              python -m pytest
              public-surface-sweeper examples/clean-repo --proof-packet
          - package: discover
            install: python -m pip install -e .
            test: |
              python -m unittest discover -s tests -t . -v
              python -m discover video examples/video-manifest.json --gate
          - package: coherence-membrane
            install: |
              sudo apt-get update && sudo apt-get install -y xvfb
              python -m pip install -e ".[test]"
            test: |
              xvfb-run -a python -m pytest -q
              python -m coherence_membrane selftest
              python conformance/run.py
              node impl/js/run.js
          - package: behavior-transform.io
            install: python -m pip install pytest
            test: |
              python -m pytest -q
              python tools/check_repo_facts.py
              python tools/check_repo_art.py
              python tools/behavior_flagship.py doctor --json
          - package: chorus
            install: python -m pip install -e . pytest
            test: |
              python -m pytest -q
              python tools/check_repo_art.py
          - package: plexus
            install: python -m pip install -e ".[test]"
            test: |
              python -m pytest -q
              python examples/tour.py
          - package: mneme
            install: python -m pip install -e ".[test]"
            test: |
              python -m pytest -q
              python examples/tour.py
          - package: relay
            install: python -m pip install -e ".[test]"
            test: |
              python -m pytest -q
              python tools/check_release_metadata.py
          # canon's own repo-art job: the drawings match their spec, and a fresh
          # render leaves the committed files unchanged.
          - package: canon
            install: python -m pip install -e ".[dev]"
            test: |
              python -m pytest
              python tools/check_repo_art.py
              python tools/render_repo_art.py
              git diff --exit-code -- .
          # index's CI ran Linux on Python 3.12: its suite, then the compat suite.
          - package: index
            install: python -m pip install -e ".[test]"
            test: |
              python -m pytest
              python -m pytest compat/workspace-repo-map/tests -q
          # crucible's CI ran Linux on Python 3.11 and 3.12, each with every step
          # below: lint, type check, tests with the coverage floor, the demo, the
          # version check, the build, and a smoke run of the built wheel.
          - package: crucible
            python: "3.11"
            install: python -m pip install -e ".[dev]"
            test: |
              ruff check src tests examples
              mypy src/crucible
              pytest -q --cov=crucible --cov-report=term-missing --cov-fail-under=85
              python examples/demo.py
              python scripts/check_version_sites.py .
              python -m build
              python -m twine check dist/*
              python scripts/smoke_wheel.py dist/*.whl
          - package: crucible
            python: "3.12"
            install: python -m pip install -e ".[dev]"
            test: |
              ruff check src tests examples
              mypy src/crucible
              pytest -q --cov=crucible --cov-report=term-missing --cov-fail-under=85
              python examples/demo.py
              python scripts/check_version_sites.py .
              python -m build
              python -m twine check dist/*
              python scripts/smoke_wheel.py dist/*.whl
    defaults:
      run:
        shell: bash
        working-directory: packages/${{ matrix.package }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@0b93645e9fea7318ecaed2b359559ac225c90a2b # v5.3.0
        with:
          python-version: ${{ matrix.python || '3.12' }}
      - name: Install from packages/${{ matrix.package }}
        run: |
          python -m pip install --upgrade pip pytest-timeout
          ${{ matrix.install }}
      - name: The package's own tests
        run: ${{ matrix.test }}
      - name: Art receipt digests
        if: ${{ hashFiles(format('packages/{0}/scripts/check_art_receipts.py', matrix.package)) != '' }}
        run: python scripts/check_art_receipts.py

  workflow-harness-lite:
    name: workflow-harness-lite
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: packages/workflow-harness-lite
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
      - run: npm test
      - run: npm pack --dry-run
      - run: python3 scripts/check_art_receipts.py

  accountable-engine:
    name: accountable-engine
    runs-on: windows-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: packages/accountable-engine
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: The critic script runs
        shell: pwsh
        run: powershell -NoProfile -ExecutionPolicy Bypass -File .\critic.ps1
      - run: python scripts/check_art_receipts.py

  terminal-state-fixtures:
    name: terminal-state-fixtures
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        shell: bash
        working-directory: packages/terminal-state-fixtures
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@0b93645e9fea7318ecaed2b359559ac225c90a2b # v5.3.0
        with:
          python-version: "3.12"
      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install datasets pytest pytest-timeout uv
          python -m pip install -e environments/mlflow_terminal_state
      - name: Test mlflow-terminal-state
        working-directory: packages/terminal-state-fixtures/environments/mlflow_terminal_state
        run: python -m pytest tests/ -q
      - name: Test the METR terminal-state TaskFamily
        # uv builds its own environment from the project's lock, with no
        # pytest-timeout in it, so the repository's addopts are cleared here.
        run: uv run --project environments/metr_terminal_state_runs python -m pytest -o addopts= environments/metr_terminal_state_runs/tests -q --task-standard-task-family-name metr_terminal_state_runs --task-standard-task-name run_000
      - name: The card and the artwork still match the code
        run: |
          python tools/check_repo_facts.py
          python tools/check_repo_art.py
          python scripts/check_art_receipts.py

  learn:
    # The same legs learn's CI ran in its own repository: three systems, Node 20 and 22.
    name: learn (${{ matrix.os }}, node ${{ matrix.node-version }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        node-version: ["20", "22"]
    defaults:
      run:
        shell: bash
        working-directory: packages/learn
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ matrix.node-version }}
      # The runtime needs only Node. Python is here because the artwork gates in
      # tools/ are Python, and the planted-package test needs 3.11 or later.
      - uses: actions/setup-python@0b93645e9fea7318ecaed2b359559ac225c90a2b # v5.3.0
        with:
          python-version: "3.11"
      - name: Test
        run: node --test
      - name: Doctor (self-test)
        run: node src/cli.mjs doctor
      - name: Status
        run: node src/cli.mjs status
      # Pack the tarball, install it into an empty folder and run its commands from there.
      - name: Pack the tarball and run it through npx
        run: |
          mkdir -p packed
          npm pack --pack-destination packed
          node scripts/smoke-tarball.mjs packed/harperz9-learn-"$(node -p "require('./package.json').version")".tgz
      - name: Art receipt digests
        if: runner.os == 'Linux' && matrix.node-version == '22'
        run: python scripts/check_art_receipts.py

  python-legs:
    # The other legs each tool's CI ran in its own repository. The python job
    # above already runs every package on Linux with Python 3.12, so that one
    # combination is left out here. A package joins by its name in `package`
    # and one `include` row with the extra command its CI ran after pytest.
    name: ${{ matrix.package }} (${{ matrix.os }}, python ${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        package: [plexus, mneme, relay, canon]
        os: [ubuntu-latest, windows-latest, macos-latest]
        python: ["3.11", "3.12", "3.13"]
        exclude:
          - os: ubuntu-latest
            python: "3.12"
          # canon's CI ran Linux and Windows only.
          - package: canon
            os: macos-latest
        include:
          - package: plexus
            extra: python examples/tour.py
          - package: mneme
            extra: python examples/tour.py
          - package: relay
            extra: python tools/check_release_metadata.py
          # canon names its test extra `dev` and ran nothing after pytest.
          - package: canon
            extras: dev
    defaults:
      run:
        shell: bash
        working-directory: packages/${{ matrix.package }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@0b93645e9fea7318ecaed2b359559ac225c90a2b # v5.3.0
        with:
          python-version: ${{ matrix.python }}
      - name: Install from packages/${{ matrix.package }}
        run: |
          python -m pip install --upgrade pip pytest-timeout
          python -m pip install -e ".[${{ matrix.extras || 'test' }}]"
      - name: The package's own tests
        run: python -m pytest -q
      - name: The command its CI ran after the tests
        if: ${{ matrix.extra }}
        run: ${{ matrix.extra }}

  python-wheel:
    # Build the wheel, install it in a clean venv and run the packaged
    # command, as each tool's CI did in its own repository.
    name: ${{ matrix.package }} (wheel)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        include:
          - package: plexus
            smoke: |
              /tmp/vc/bin/plexus --version
              /tmp/vc/bin/plexus discover --builtin > /dev/null
          - package: mneme
            smoke: |
              /tmp/vc/bin/mneme --version
              /tmp/vc/bin/mneme bench > /dev/null
          - package: relay
            smoke: |
              /tmp/vc/bin/relay --help > /dev/null
          - package: canon
            smoke: |
              /tmp/vc/bin/canon --help > /dev/null
              /tmp/vc/bin/canon-client --help > /dev/null
          - package: index
            smoke: |
              /tmp/vc/bin/index --version
              /tmp/vc/bin/index --help > /dev/null
    defaults:
      run:
        shell: bash
        working-directory: packages/${{ matrix.package }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@0b93645e9fea7318ecaed2b359559ac225c90a2b # v5.3.0
        with:
          python-version: "3.12"
      - name: Build the wheel
        run: |
          python -m pip install build
          python -m build
      - name: Install the wheel in a clean venv and run the packaged command
        run: |
          python -m venv /tmp/vc
          /tmp/vc/bin/pip install dist/*.whl
          ${{ matrix.smoke }}

  canon-client-package:
    # canon's own client-package job: build the source and the native client
    # package on Windows and run the acceptance checks the build script carries.
    name: canon (client package, windows)
    runs-on: windows-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: packages/canon
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@0b93645e9fea7318ecaed2b359559ac225c90a2b # v5.3.0
        with:
          python-version: "3.12"
      - run: python -m pip install -e ".[dev]" pyinstaller==6.21.0
      - name: source and native package acceptance
        shell: pwsh
        run: |
          $env:TEMP = (Get-Item -LiteralPath $env:RUNNER_TEMP).FullName
          $env:TMP = $env:TEMP
          python scripts/build_client_package.py "$env:RUNNER_TEMP/canon-source"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python scripts/build_client_package.py "$env:RUNNER_TEMP/canon-native" --native
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
