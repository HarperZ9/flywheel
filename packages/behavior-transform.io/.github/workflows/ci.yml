name: behavior-transform.io CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: Install test dependencies
        run: python -m pip install pytest

      - name: Run tests
        run: python -m pytest -q

      - name: Verify flagship envelope
        run: |
          python -m unittest tests.test_behavior_flagship -v
          python tools/behavior_flagship.py doctor --json

  docs-art:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: Re-render the README art and compare it to what is committed
        run: python tools/check_repo_art.py

      - name: Bind the drawn card and flows to the code that backs them
        run: python tools/check_repo_facts.py
  art-receipts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Verify art receipt digests
        run: python3 scripts/check_art_receipts.py
