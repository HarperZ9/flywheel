name: release

# Publish to PyPI with OIDC trusted publishing. No token is stored anywhere.
#
# One-time setup on PyPI: add a trusted publisher for project "flywheel-canon",
# owner "HarperZ9", repo "canon", workflow "release.yml", environment "pypi".
# For a project that does not exist yet, register it as a PENDING publisher; the
# first successful run creates the project. Then set the repository variable
# PYPI_ENABLED to 'true'.
#
# To release, bump the version in pyproject.toml and src/canon/_version.py,
# merge, and push a tag that matches it:
#   git tag -a v0.5.0 -m "canon 0.5.0" && git push origin v0.5.0
# The tag push starts a run, and so does publishing a GitHub release for that
# tag. The second run builds and checks the same version again, and its
# publish step skips the files PyPI already has.
#
# Actions are pinned by commit SHA, not by tag. A moving tag is a supply-chain
# hole, and this is a project about verifiable provenance.

on:
  push:
    tags: ["v*"]
  release:
    types: [published]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@0b93645e9fea7318ecaed2b359559ac225c90a2b # v5.3.0
        with:
          python-version: "3.12"

      - name: build sdist and wheel
        run: |
          python -m pip install --upgrade build
          python -m build

      - name: verify the full source suite before publishing
        run: |
          python -m pip install -e ".[dev]"
          python -m pytest

      - name: the tag must match the declared version
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          PKG_VER=$(python -c "import tomllib;print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")
          TAG_VER="${GITHUB_REF_NAME#v}"
          if [ -n "$TAG_VER" ] && [ "$TAG_VER" != "$PKG_VER" ]; then
            echo "tag $TAG_VER does not match pyproject $PKG_VER"; exit 1
          fi
          echo "version gate: tag $TAG_VER == pyproject $PKG_VER"

      - name: artifact digests, recorded in the run log
        run: |
          python - <<'EOF'
          import hashlib, pathlib
          for p in sorted(pathlib.Path("dist").iterdir()):
              print(f"sha256  {hashlib.sha256(p.read_bytes()).hexdigest()}  {p.name}")
          EOF

      # Installs the wheel into a clean venv and resolves EVERY declared console
      # script to a real callable. Stronger than `--version`: a package whose
      # entry point names a missing function installs fine and fails at first
      # use, and that is exactly the defect this step was written to catch.
      - name: no broken release, resolve every entry point
        run: |
          python -m venv /tmp/smoke
          /tmp/smoke/bin/pip install --upgrade pip
          /tmp/smoke/bin/pip install "$(echo dist/*.whl)"
          /tmp/smoke/bin/python - <<'EOF'
          from importlib.metadata import distribution
          d = distribution("flywheel-canon")
          eps = [e for e in d.entry_points if e.group == "console_scripts"]
          for e in eps:
              fn = e.load()
              assert callable(fn), f"{e.name} -> {e.value} is not callable"
              print(f"entry point ok: {e.name} -> {e.value}")
          print(f"flywheel-canon {d.version}: {len(eps)} entry point(s) resolved")
          # The number the CLI prints is the number the index will show. 0.4.0
          # resolved its entry point and still answered --version with a usage
          # error, so resolving is not enough.
          import pathlib, subprocess, sys
          canon = pathlib.Path(sys.executable).with_name("canon")
          said = subprocess.run([str(canon), "--version"], capture_output=True,
                                text=True, check=True).stdout.strip()
          assert said == f"canon {d.version}", f"canon --version said {said!r}"
          print(f"version ok: {said}")
          EOF

      - name: the sdist must build a wheel too
        run: |
          python -m venv /tmp/sd
          /tmp/sd/bin/pip install --upgrade pip build
          python -c "import pathlib,tarfile; archive=next(pathlib.Path('dist').glob('*.tar.gz')); tarfile.open(archive).extractall('/tmp/sdsrc', filter='data')"
          /tmp/sd/bin/python -m build --wheel --outdir /tmp/sdout "$(echo /tmp/sdsrc/*)"
          ls -l /tmp/sdout

      - uses: actions/upload-artifact@b4b15b8c7c6ac21ea08fcf65892d2ee8f75cf882 # v4.4.3
        with:
          name: dist
          path: dist/

  publish:
    needs: build
    # Stays skipped until the trusted publisher exists and PYPI_ENABLED is 'true',
    # so a tag builds and smokes without a failing publish run beforehand.
    if: ${{ vars.PYPI_ENABLED == 'true' && startsWith(github.ref, 'refs/tags/v') }}
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write        # OIDC. No token, no secret.
    steps:
      - uses: actions/download-artifact@fa0a91b85d4f404e444e00e005971372dc801d16 # v4.1.8
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
        with:
          # PEP 740 attestations: the index records who built these bytes and
          # from which workflow, verifiable without trusting us.
          attestations: true
          # A second run for the same version (tag push, then Release) finds the
          # files already uploaded and finishes instead of failing.
          skip-existing: true
