name: CI

on:
  push:
  pull_request:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -e ".[test]"
      - run: python -m pytest
      - run: public-surface-sweeper examples/clean-repo --proof-packet
  art-receipts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Verify art receipt digests
        run: python3 scripts/check_art_receipts.py
