[build-system]
requires = ["hatchling>=1.25,<1.31"]
build-backend = "hatchling.build"

[project]
name = "public-surface-sweeper"
version = "0.1.3"
description = "Audit public and developer delivery surfaces for GitHub-facing repositories before release."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Zain Dana Harper" }]
keywords = ["repository", "release", "hygiene", "proof", "cli"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Topic :: Software Development :: Quality Assurance",
]
dependencies = ["proof-surface>=0.1"]

[project.urls]
Homepage = "https://harperz9.github.io/repo-explainers/public-surface-sweeper.html"
Source = "https://github.com/HarperZ9/public-surface-sweeper"
Issues = "https://github.com/HarperZ9/public-surface-sweeper/issues"
Changelog = "https://github.com/HarperZ9/public-surface-sweeper/blob/main/CHANGELOG.md"

[project.optional-dependencies]
test = ["pytest>=8"]

[project.scripts]
public-surface-sweeper = "public_surface_sweeper.cli:main"

[tool.pytest.ini_options]
addopts = "-q"
pythonpath = ["src"]
testpaths = ["tests"]
