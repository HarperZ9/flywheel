name: flywheel_desktop
description: "Flywheel Desktop — the native surface for the one platform: routing, verification, lanes, the closed loop, and the projected world."
publish_to: "none"
version: 0.6.1+16

environment:
  sdk: ^3.6.0

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  http: ^1.2.0
  crypto: ^3.0.5
  url_launcher: ^6.3.2
  speech_to_text: ^7.4.0
  flutter_tts: ^4.2.5
  path_provider: ^2.1.4
  video_player: 2.14.0
  video_player_win: 3.2.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  video_player_platform_interface: ^6.9.0

flutter:
  uses-material-design: true
  shaders:
    - shaders/rowan.frag
  fonts:
    - family: Hanken Grotesk
      fonts:
        - asset: assets/fonts/hanken-grotesk-light.ttf
          weight: 300
        - asset: assets/fonts/hanken-grotesk-regular.ttf
          weight: 400
        - asset: assets/fonts/hanken-grotesk-italic.ttf
          weight: 400
          style: italic
        - asset: assets/fonts/hanken-grotesk-medium.ttf
          weight: 500
        - asset: assets/fonts/hanken-grotesk-semibold.ttf
          weight: 600
        - asset: assets/fonts/hanken-grotesk-bold.ttf
          weight: 700
        - asset: assets/fonts/hanken-grotesk-extrabold.ttf
          weight: 800
    - family: Cascadia Mono
      fonts:
        - asset: assets/fonts/CascadiaMono.ttf
          weight: 200
        - asset: assets/fonts/CascadiaMono.ttf
          weight: 300
        - asset: assets/fonts/CascadiaMono.ttf
          weight: 400
        - asset: assets/fonts/CascadiaMono.ttf
          weight: 500
        - asset: assets/fonts/CascadiaMono.ttf
          weight: 600
        - asset: assets/fonts/CascadiaMono.ttf
          weight: 700
        - asset: assets/fonts/CascadiaMonoItalic.ttf
          weight: 200
          style: italic
        - asset: assets/fonts/CascadiaMonoItalic.ttf
          weight: 300
          style: italic
        - asset: assets/fonts/CascadiaMonoItalic.ttf
          weight: 400
          style: italic
        - asset: assets/fonts/CascadiaMonoItalic.ttf
          weight: 500
          style: italic
        - asset: assets/fonts/CascadiaMonoItalic.ttf
          weight: 600
          style: italic
        - asset: assets/fonts/CascadiaMonoItalic.ttf
          weight: 700
          style: italic
