[pytest]
# Phase 0: per-test timeout so a single hang cannot wedge the suite (no
# pytest-timeout before this; the full run stalled past ~30% collection).
# 60s is generous for unit tests; anything slower is a smoke/integration test
# that should be marked and run separately.
addopts = --timeout=60 --timeout-method=thread -q
testpaths = tests
markers =
    real_keychain: reads the real OS credential store; opts out of the
        suite-wide keychain blanking in conftest.
    release_gate: run by publish.yml against the built wheel before anything
        is published. scripts/release_assets.py gate-tests lists the files.
