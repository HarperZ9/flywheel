# pyproject.toml -- Flywheel: the one platform.
#
# Flywheel is the umbrella surface that encompasses routing, verification,
# the lane layer (the flagship tool family), memory/context/catalog, and the
# closed verified-inference loop. `local-model` is the trained-model lane
# inside it. See README.md and PROJECT.md.
#
# Zero runtime dependencies is a load-bearing invariant (mirrors the flagship
# tools and SUPERAPP.md "stdlib only"). The heavy optional backends -- torch,
# transformers, bitsandbytes, peft -- belong to the local-serve lane and are
# never required to import the package or run the gateway/lanes/loop-status.

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
# Distribution name: flywheel-verify. The bare `flywheel` name on PyPI is
# an unrelated package, so this publishes under a scoped name. The installed
# console command stays `flywheel` (see [project.scripts]).
name = "flywheel-verify"
version = "0.3.5"
description = "The one platform: routing, verification, the lane layer, memory/context/catalog, and the closed verified-inference loop."
readme = "README.md"
# 3.11, not 3.10, because `datetime.UTC` landed in 3.11 and 51 modules use it.
# The floor previously said 3.10 and was simply false: the package could not
# import there. The VERIFIER closure is a separate matter and carries no such
# dependency, so a stranger checking a receipt is not bound by this floor.
requires-python = ">=3.11"
license = "FSL-1.1-MIT"
license-files = ["LICENSE"]
authors = [{ name = "Zain" }]
dependencies = []

[project.optional-dependencies]
# Everything here is opt-in; the core stays zero-dependency and works
# immediately against hosted providers with just an API key. Local model
# serving via ollama needs NO extras (ollama is an external binary the
# gateway talks HTTP to). These groups exist for the paths that do need
# third-party packages:
signing = ["cryptography"]   # Ed25519 receipt SIGNING (pynacl works as the
                             # fallback backend; VERIFICATION stays stdlib)
monitor = ["psutil"]         # network egress monitoring (infra controls)
local = [                    # the local HF serve/training stack
    "torch",                 # GPU builds may need the PyTorch index URL
    "transformers",
    "peft",
    "trl",
    "accelerate",
    "datasets",
    "bitsandbytes",
    "safetensors",
    "sentencepiece",
]

[project.scripts]
# The single surface command. Dispatches to the existing run_harness_cli
# front controller plus the new lane/loop subcommands.
flywheel = "harness.cli_entry:main"

[tool.setuptools]
# Explicit package + data discovery. Keep py_modules minimal.
py-modules = []

[tool.setuptools.packages.find]
include = ["harness*"]
exclude = ["tests*", "scripts*", "dataset*", "train*", "site*", "demos*"]

[tool.pytest.ini_options]
# Phase 0: a per-test timeout so no single test can wedge the suite. The full
# collection is ~1178 tests; 60s is generous for a unit test and surfaces any
# smoke/integration test that should be marked and split out.
addopts = "--timeout=60 --timeout-method=thread -q"
testpaths = ["tests"]
